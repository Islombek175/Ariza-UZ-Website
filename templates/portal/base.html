{% load static %}<!doctype html>
<html lang="uz" data-theme="light"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#138A78"><title>{% block title %}Ariza.uz{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'portal/app.css' %}"><link rel="stylesheet" href="{% static 'portal/admin.css' %}"><script src="https://telegram.org/js/telegram-web-app.js"></script>
</head><body>
<main class="{% block shell %}app-shell{% endblock %}">
{% if messages %}<div class="toasts">{% for message in messages %}<div class="toast {{ message.tags }}">{{ message }}</div>{% endfor %}</div>{% endif %}
{% block content %}{% endblock %}</main>
<script>window.CSRF_TOKEN="{{ csrf_token }}";</script><script src="{% static 'portal/app.js' %}?v=20260728-8"></script>{% block scripts %}{% endblock %}
</body></html>
